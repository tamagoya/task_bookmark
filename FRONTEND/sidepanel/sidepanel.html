<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>タスクブックマーク</title>
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>タスクブックマーク</h1>
    </header>
    
    <main>
      <div id="auth-section">
        <div id="auth-status" class="status">
          <p>認証状態を確認中...</p>
        </div>
        <button id="auth-button" class="button primary" style="display: none;" aria-label="Googleアカウントで認証">
          認証する
        </button>
        <button id="logout-button" class="button secondary" style="display: none;" aria-label="ログアウト">
          ログアウト
        </button>
      </div>

      <div id="tabs-section" style="display: none;">
        <h2>現在のタブ (<span id="tab-count">0</span>)</h2>
        <div id="tabs-list" class="tabs-list"></div>
      </div>

      <div id="save-section" style="display: none;">
        <h2>仕事状態を保存</h2>
        <div id="restored-at-display" class="restored-at-display" style="display: none;" aria-live="polite"></div>
        <form id="save-form">
          <div class="form-group">
            <label for="work-title">仕事名 <span class="required">*</span></label>
            <input type="text" id="work-title" name="title" required maxlength="200" placeholder="例: プロジェクトAの調査">
          </div>
          <div class="form-group">
            <label for="work-memo">メモ（任意）</label>
            <textarea id="work-memo" name="memo" rows="3" maxlength="1000" placeholder="作業メモを入力..."></textarea>
          </div>
          <button type="submit" id="save-button" class="button primary" aria-label="仕事状態を保存">
            保存する
          </button>
        </form>
      </div>

      <div id="message-section" style="display: none;" role="alert" aria-live="polite">
        <div id="message" class="message"></div>
      </div>

      <!-- プログレスバー -->
      <div id="restore-progress" class="progress-container" style="display: none;">
        <div class="progress-label">タブを復元中...</div>
        <progress id="restore-progress-bar" max="100" value="0"></progress>
        <div class="progress-text">0 / 0</div>
      </div>

      <div id="work-states-section" style="display: none;">
        <h2>保存済み仕事</h2>
        <div id="work-states-controls" class="work-states-controls">
          <div class="search-group">
            <input type="text" id="work-states-search" class="search-input" placeholder="仕事名で検索...">
          </div>
          <div class="filter-group">
            <button class="filter-button" data-filter="today">今日</button>
            <button class="filter-button" data-filter="thisWeek">今週</button>
            <button class="filter-button" data-filter="thisMonth">今月</button>
            <button class="filter-button active" data-filter="all">すべて</button>
          </div>
        </div>
        <div id="work-states-loading" class="loading" style="display: none;">
          <p>読み込み中...</p>
        </div>
        <div id="work-states-error" class="error-message" style="display: none;">
          <p id="work-states-error-text"></p>
          <button id="work-states-retry-button" class="button secondary" aria-label="保存済み仕事の再読み込み">再試行</button>
        </div>
        <div id="work-states-list" class="work-states-list"></div>
      </div>

      <!-- URL編集モーダル（Bolt 8） -->
      <div id="url-edit-modal" class="modal" style="display: none;">
        <div class="modal-content">
          <div class="modal-header">
            <h2 id="url-edit-title">URL編集</h2>
            <button id="url-edit-close" class="modal-close" aria-label="閉じる">×</button>
          </div>
          <div class="modal-body">
            <div id="url-edit-tabs-list" class="url-edit-tabs-list"></div>
            <div class="url-edit-add-section">
              <h3>新しいURLを追加</h3>
              <div class="url-edit-add-form">
                <input type="text" id="url-edit-new-url" class="url-edit-input" placeholder="https://example.com">
                <input type="text" id="url-edit-new-title" class="url-edit-input" placeholder="ページタイトル（任意）">
                <button id="url-edit-add-button" class="button secondary" aria-label="新しいURLを追加">追加</button>
              </div>
            </div>
          </div>
          <div id="url-edit-error" class="modal-error" style="display: none;" role="alert" aria-live="polite"></div>
          <div class="modal-footer">
            <button id="url-edit-cancel" class="button secondary" aria-label="URL編集をキャンセル">キャンセル</button>
            <button id="url-edit-save" class="button primary" aria-label="URL変更を保存">保存</button>
          </div>
        </div>
      </div>
    </main>
  </div>
  <script type="module" src="sidepanel.ts"></script>
</body>
</html>
