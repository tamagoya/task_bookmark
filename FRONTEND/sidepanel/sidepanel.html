<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>タスクブックマーク</title>
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>タスクブックマーク</h1>
    </header>
    
    <main>
      <div id="auth-section">
        <div id="auth-status" class="status">
          <p>認証状態を確認中...</p>
        </div>
        <button id="auth-button" class="button primary" style="display: none;">
          認証する
        </button>
        <button id="logout-button" class="button secondary" style="display: none;">
          ログアウト
        </button>
      </div>

      <div id="tabs-section" style="display: none;">
        <h2>現在のタブ (<span id="tab-count">0</span>)</h2>
        <div id="tabs-list" class="tabs-list"></div>
      </div>

      <div id="save-section" style="display: none;">
        <h2>仕事状態を保存</h2>
        <form id="save-form">
          <div class="form-group">
            <label for="work-title">仕事名 <span class="required">*</span></label>
            <input type="text" id="work-title" name="title" required maxlength="200" placeholder="例: プロジェクトAの調査">
          </div>
          <div class="form-group">
            <label for="work-memo">メモ（任意）</label>
            <textarea id="work-memo" name="memo" rows="3" maxlength="1000" placeholder="作業メモを入力..."></textarea>
          </div>
          <button type="submit" id="save-button" class="button primary">
            保存する
          </button>
        </form>
      </div>

      <div id="message-section" style="display: none;">
        <div id="message" class="message"></div>
      </div>
    </main>
  </div>
  <script type="module" src="sidepanel.ts"></script>
</body>
</html>
